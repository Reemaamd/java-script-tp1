<script>
    let number1 = prompt("svp veuillez saisir le premier nombre ");
    console.log("l'utilisateur a enter : "+number1)
    let number2 = prompt("svp veuillez saisir le deuxieme nombre ")
    console.log("l'utilisateur a entrer :"+number2)
      // Convertir les entrées en nombres
  number1 = parseFloat(number1);
  number2 = parseFloat(number2);
    console.log("la somme du deux nomberes est "+ (number1 + number2) )
    console.log("la difference du deux nomberes est "+ (number1 - number2) )
    console.log("le produit du deux nomberes est "+ (number1 * number2) )
    console.log("le quotient du deux nomberes est "+ (number1 / number2) )
    
</script>
